name: HarmonyUp
options:
  bundleIdPrefix: com.kimjiwon
  deploymentTarget:
    iOS: "17.0"

targets:
  HarmonyUp:
    type: application
    platform: iOS
    sources:
      - path: HarmonyUp/Sources
      # WORLD(고품질 음성 분석/합성 라이브러리, modified-BSD 라이선스) — 123절 화음 재설계
      # 2단계에서 목소리 피치시프트를 다시 시도하며 복원(124절, 1단계: 빌드만 먼저 확인).
      # HarmonyUpWorldBridge.h/.cpp가 Swift에서 부를 수 있는 C 링키지 진입점이다.
      - path: HarmonyUp/ThirdParty/World
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimjiwon.HarmonyUp
        DEVELOPMENT_TEAM: C5P7V9S6NT
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: HarmonyUp/Sources/App/Source/HarmonyUp-Bridging-Header.h
        HEADER_SEARCH_PATHS: HarmonyUp/ThirdParty/World
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
      configs:
        # 기본 Debug 빌드(-Onone)는 YIN/MelodySegmenter처럼 윈도우마다 도는 신호처리
        # 루프가 실기기에서도 눈에 띄게 느려진다(디버깅용 최적화 해제가 원인). 이 프로젝트는
        # 실기기 성능 확인이 항상 필요하니, Debug에서도 최적화 컴파일을 켠다.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"
    info:
      path: HarmonyUp/Sources/App/Source/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "멜로디를 녹음해서 화음을 분석하기 위해 마이크가 필요합니다."
        # 이 키가 없으면 Xcode가 매 빌드마다 "All interface orientations must be supported
        # unless the app requires full screen" 경고를 낸다 — 아이패드 분할 레이아웃(61절)이
        # 가로/세로 회전에 반응하도록 만들어져 있으니, 네 방향 전부 명시적으로 지원한다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 커스텀 폰트(Pretendard)를 쓰려면 iOS에 번들 폰트 파일을 등록해야 한다 —
        # HarmonyUp/Sources/Resources/Fonts에 넣은 4개 굵기 파일명과 정확히 일치해야 함.
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
    dependencies: []

  HarmonyUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarmonyUp/Tests
    dependencies:
      - target: HarmonyUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimjiwon.HarmonyUpTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HarmonyUp:
    build:
      targets:
        HarmonyUp: all
        HarmonyUpTests: [test]
    test:
      targets:
        - HarmonyUpTests
    run:
      config: Debug
