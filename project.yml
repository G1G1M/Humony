name: HarmonyUp
options:
  bundleIdPrefix: com.kimjiwon
  deploymentTarget:
    iOS: "17.0"

targets:
  HarmonyUp:
    type: application
    platform: iOS
    sources:
      - path: HarmonyUp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimjiwon.HarmonyUp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: HarmonyUp/Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "멜로디를 녹음해서 화음을 분석하기 위해 마이크가 필요합니다."
    dependencies: []

  HarmonyUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarmonyUp/Tests
    dependencies:
      - target: HarmonyUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimjiwon.HarmonyUpTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HarmonyUp:
    build:
      targets:
        HarmonyUp: all
        HarmonyUpTests: [test]
    test:
      targets:
        - HarmonyUpTests
    run:
      config: Debug
