<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff; /* 악보는 앱 다크모드와 무관하게 항상 흰 종이 — docs/CONCEPTS.md 57절 */
  }
  /* 세로도 스크롤 가능해야 한다 — hidden으로 막아두면 내용이 카드 높이를 넘칠 때
     잘려서 오히려 "겹쳐 보이는" 것처럼 보인다(실기기 피드백으로 발견, docs/CONCEPTS.md 58절). */
  #scoreWrapper {
    overflow: auto;
    width: 100%;
    height: 100%;
    -webkit-overflow-scrolling: touch;
  }
  #score {
    display: inline-block;
  }
</style>
</head>
<body>
<div id="scoreWrapper"><div id="score"></div></div>
<script src="vexflow.js"></script>
<script src="render.js"></script>
</body>
</html>
